<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Pembaruan Layanan | Evidence Command Center (ECC)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="/assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            margin: 0;
            padding: 16px;
        }
        .maintenance-card {
            text-align: center;
            background: #ffffff;
            padding: 32px 24px;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            max-width: 520px;
            width: 100%;
        }
        .icon-wrap {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background-color: #eff6ff;
            color: #1e40af;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            margin-bottom: 16px;
        }
        .maintenance-title {
            font-weight: 700;
            color: #0f172a;
            font-size: 1.75rem;
            line-height: 1.25;
            margin: 0 0 8px;
        }
        .desc {
            color: #475569;
            font-size: 0.875rem;
            line-height: 1.6;
            margin: 0 0 24px;
        }
        .status-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            text-align: left;
        }
        .status-main {
            font-size: 0.875rem;
            font-weight: 600;
            color: #0f172a;
        }
        .status-sub {
            font-size: 0.75rem;
            color: #475569;
        }
        .countdown-pill {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1e40af;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .btn-reload {
            min-height: 44px;
            padding: 8px 24px;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .footer-note {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.75rem;
            color: #475569;
            font-variant-numeric: tabular-nums;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition: none !important;
                animation: none !important;
            }
        }
    </style>
</head>
<body>
    <main class="maintenance-card">
        <div class="icon-wrap" aria-hidden="true">
            <i class="bi bi-arrow-repeat" aria-hidden="true"></i>
        </div>

        <h1 class="maintenance-title">Pembaruan Layanan Sedang Berlangsung</h1>
        <p class="desc">
            Layanan sedang diperbarui untuk sementara. Silakan coba kembali beberapa saat lagi.
        </p>

        <div class="status-box">
            <div>
                <div class="status-main">Pembaruan sementara aktif</div>
                <div class="status-sub">Data Anda tetap aman tersimpan.</div>
            </div>
            <div class="countdown-pill" id="countdownTimer" aria-live="polite">
                Muat ulang otomatis: <span id="timerSeconds">30</span> detik
            </div>
        </div>

        <button type="button" id="btnReloadMaintenance" class="btn btn-primary rounded-pill fw-semibold btn-reload">
            <i class="bi bi-arrow-clockwise" aria-hidden="true"></i>
            <span>Muat Ulang Halaman</span>
        </button>

        <p class="footer-note mb-0">
            Evidence Command Center (ECC) &bull; PKTJ Tegal &bull; v 2.0
        </p>
    </main>

    <script>
        (function () {
            const btnReload = document.getElementById('btnReloadMaintenance');
            if (btnReload) {
                btnReload.addEventListener('click', function () {
                    window.location.reload();
                });
            }

            let timeLeft = 30;
            const timerEl = document.getElementById('timerSeconds');
            const interval = window.setInterval(function () {
                timeLeft--;
                if (timerEl) {
                    timerEl.textContent = String(Math.max(0, timeLeft));
                }
                if (timeLeft <= 0) {
                    window.clearInterval(interval);
                    window.location.reload();
                }
            }, 1000);
        })();
    </script>
</body>
</html>
